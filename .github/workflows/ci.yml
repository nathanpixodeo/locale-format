name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linting is a static check: its result cannot vary with the Node version, so
  # running it once is enough. It also has to run separately, because ESLint 10
  # requires Node >= 20.19 while this package supports Node 18 — linting inside
  # the matrix would fail the Node 18 row for a reason that says nothing about
  # whether the package works on Node 18.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Node version the development toolchain runs on. The floor
        # declared in `engines` is older than this and is covered by
        # `node18-artifact` below.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Check bundle size budgets
        run: npm run check-size

      - name: Inspect the publish tarball
        run: npm pack --dry-run

  # `engines.node` promises 18.17.0, but the development toolchain no longer runs
  # there: vitest depends on rolldown, which imports `styleText` from `node:util`,
  # added in Node 20.12. That promise is about the artifact consumers install, not
  # about the test runner, so it is checked the way a consumer would check it —
  # build and pack on a current Node, then install the tarball on the exact
  # version named in `engines` and run it. This covers the published exports map,
  # both module formats and the lazy-loading chunks, which running the source
  # suite on Node 18 never did.
  node18-artifact:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "${RUNNER_TEMP}"

      - name: Switch to the oldest supported Node
        uses: actions/setup-node@v7
        with:
          node-version: '18.17.0'

      - name: Install the tarball and exercise it
        run: |
          version="$(node -p "require('${GITHUB_WORKSPACE}/package.json').version")"
          mkdir -p "${RUNNER_TEMP}/smoke"
          cd "${RUNNER_TEMP}/smoke"
          npm init -y > /dev/null
          npm install "${RUNNER_TEMP}/nexkit-locale-format-${version}.tgz"
          # smoke.mjs has to sit beside the node_modules it is testing: Node
          # resolves a bare specifier from the importing file's directory, so a
          # copy run from the checkout would resolve back to the source tree.
          cp "${GITHUB_WORKSPACE}/scripts/smoke.mjs" .
          node smoke.mjs "${version}"
